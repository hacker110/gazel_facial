================================================================================
Gazel Facial 项目说明（架构与业务逻辑）
更新日期：2026-01-08
================================================================================

一、项目概览
--------------------------------------------------------------------------------
1、项目名称：Face Demo（HMS Module Body）
2、包名：com.huawei.mlkit.sample
3、工程形态：单模块 Android 应用（settings.gradle）
4、应用 ID：com.huawei.mlkit.sample
5、SDK 范围：minSdk 19 / targetSdk 31 / compileSdk 31，Java 8
6、版本：versionName 3.7.0.300

二、技术栈
--------------------------------------------------------------------------------
1、人脸能力：华为 HMS ML Kit 人脸检测 SDK（本地 AAR，约 3.7.0.x，见 module-body/libs）
2、眼动预测：GAZEL 模型
3、图像处理：OpenCV（opencv-debug.aar + libs/native 下 libopencv_java4.so）
4、其他依赖：Gson、Apache Commons Math3、Glide、AndroidX

三、工程结构
--------------------------------------------------------------------------------
FacialDemo/
├── build.gradle / settings.gradle      # 根工程与华为 AGConnect / Maven 仓库
├── docs/                               # 文档（本文件、架构文档、接口文档、眼动集成文档等）
└── module-body/                        # 唯一应用模块
    ├── libs/                           # HMS ML Kit / OpenCV 等本地 AAR 与 native so
    ├── src/main/assets/models/         # GAZEL TFLite 模型
    └── src/main/java/.../sample/
        ├── activity/                   # UI 入口与功能页
        ├── camera/                     # 相机采集与帧调度
        ├── transactor/                 # 业务编排（人脸 / 眼动）
        ├── gaze/gazelle/               # GAZEL 眼动算法流水线
        ├── config/                     # 多设备适配配置
        ├── views/graphic|overlay/      # 检测结果叠加绘制
        └── util/                       # 图像转换、帧率、常量等工具

四、分层架构
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────┐
│ Activity 层                                                  │
│   StartActivity / FaceDetectionActivity / GazelleGazeActivity│
├─────────────────────────────────────────────────────────────┤
│ Transactor 层（帧业务编排）                                    │
│   BaseTransactor → LocalFaceTransactor / GazelleGazeTransactor│
├─────────────────────────────────────────────────────────────┤
│ Engine 层                                                    │
│   LensEngine（相机生命周期、预览回调、帧处理线程）                │
├─────────────────────────────────────────────────────────────┤
│ Camera 层                                                    │
│   CameraConfiguration / CameraSelector / LensEnginePreview   │
├─────────────────────────────────────────────────────────────┤
│ 算法层                                                       │
│   HMS MLFaceAnalyzer（人脸）                                 │
│   GazelleGazeTracker + FeatureExtractor + TFLite（眼动）      │
├─────────────────────────────────────────────────────────────┤
│ Graphic 层                                                   │
│   GraphicOverlay + LocalFaceGraphic / GazelleGazeGraphic     │
├─────────────────────────────────────────────────────────────┤
│ Config 层                                                    │
│   DeviceConfigManager / DeviceType / DeviceConfig            │
└─────────────────────────────────────────────────────────────┘

数据流（统一）：
  相机 NV21 帧 → LensEngine → Transactor.process
    → ML Kit / TFLite 推理 → GraphicOverlay 绘制 → 界面呈现

五、入口与导航业务
--------------------------------------------------------------------------------
1、启动页：StartActivity（LAUNCHER）
   - 读取 agconnect 配置设置 HMS API Key
   - 申请 CAMERA / 存储等运行时权限
   - GridView 两个入口：
     [0] 人脸检测 → FaceDetectionActivity
     [1] 眼动预测 → GazelleGazeActivity
   - 设置按钮 → SettingActivity（展示版本号）

2、Manifest 中仍声明 EyeTrackingActivity、GazeDirectionActivity，
   但对应 Java 源码已不存在，当前不可用；实际眼动入口为 GazelleGazeActivity。

六、业务模块一：人脸检测
--------------------------------------------------------------------------------
入口：FaceDetectionActivity
编排：LocalFaceTransactor
绘制：LocalFaceGraphic

1、初始化
   - DeviceConfigManager 按机型加载预览尺寸、FPS、朝向、旋转偏移等
   - 创建 LensEngine + GraphicOverlay
   - 按 UI 开关重建 MLFaceAnalyzerSetting 并挂接 LocalFaceTransactor

2、界面开关
   - 关键点/轮廓开关：TYPE_KEYPOINTS + TYPE_SHAPES
   - 特征分析开关：TYPE_FEATURES
   - 性能模式：TYPE_SPEED
   - 前后摄像头切换（单摄设备隐藏切换按钮）

3、检测能力（开启特征后由 ML Kit 输出并绘制）
   - 人脸框
   - 关键点与轮廓（眼、眉、鼻、唇等）
   - 情绪（微笑/中性/愤怒/恐惧/悲伤/厌恶/惊讶）
   - 年龄、性别
   - 眼镜/帽子/胡子概率、左右眼睁开概率、头部欧拉角等
   - 处理帧率显示

4、帧处理流程
   预览帧 → BaseTransactor（NV21→Bitmap/MLFrame）
        → MLFaceAnalyzer.asyncAnalyseFrame
        → onSuccess：清空 overlay → 可选底图 → LocalFaceGraphic → invalidate

七、业务模块二：眼动预测（GAZEL）
--------------------------------------------------------------------------------
入口：GazelleGazeActivity
编排：GazelleGazeTransactor
核心：gaze/gazelle/*（GazelleGazeTracker 等）
绘制：GazelleGazeGraphic
模型：gazel_shared_ver9.tflite

1、初始化
   - 加载设备配置（含 RK3588 旋转偏移等）
   - LensEngine + GazelleGazeTransactor
   - Transactor 内创建 GazelleGazeTracker 并 load TFLite 模型
   - 人脸分析器开启关键点与轮廓（供眼部特征裁剪），关闭一般特征分析

2、单帧业务链路
   相机帧 → HMS 人脸检测取第一张脸
        → FeatureExtractor 从 MLFace 眼部轮廓 + 帧图提取模型输入
        → TFLite 推理得到注视点
        →（可选）坐标变换 / 增强移动平均滤波 / 扫视检测
        →（可选）CalibrationManager 校准变换
        → GazeResult → GazelleGazeGraphic 绘制注视点等

3、校准
   - 界面「校准」按钮触发 CalibrationManager
   - 遮罩 + 引导点 + 进度条引导用户注视校准点
   - 校准结果持久化（SharedPreferences：gazelle_calibration）

4、与「FacialLibPro AAR 集成方案」的关系
   - docs/眼动追踪集成文档.md 描述的是 FaceTracker AAR 嵌入人脸页的方案
   - 当前主实现已改为独立页 + GAZEL TFLite；OpenCV AAR/so 仍在 libs 中保留

八、相机与设备适配
--------------------------------------------------------------------------------
1、LensEngine：创建相机、startPreview、帧线程调度 Transactor、初始化 GraphicOverlay 坐标
2、CameraSelector：选镜、预览尺寸、FPS、按朝向计算 displayOrientation / 数据 rotation
3、cameraRotationOffset：修正特殊设备安装（如 RK3588 倒装摄像头 +180°）
4、DeviceType 已配置机型示例：
   Galaxy Tab S6、红米 K80 Pro、华为 MatePad Pro、ATK-DLRK3588、Sony XQ-DQ72、GENERIC
5、DeviceConfig 还包含屏物理尺寸、摄像头相对位置、滤波窗口、扫视阈值等眼动相关参数

九、坐标与绘制约定
--------------------------------------------------------------------------------
1、GraphicOverlay 按 preview 尺寸与 Canvas 尺寸计算 width/height 缩放比
2、BaseGraphic.translateX/Y 以缩放为主；HMS 返回坐标与显示对齐时不做额外镜像
3、RK3588 等特殊机型可在数据层翻转，overlay 侧保持 isFlipped=false，避免重复修正

十、权限与运行依赖
--------------------------------------------------------------------------------
1、权限：CAMERA、INTERNET、READ/WRITE_EXTERNAL_STORAGE
2、硬件：camera / autofocus
3、HMS：需正确配置 API Key（AGConnectServicesConfig）
4、模型：assets 中 tflite 不压缩打包（aaptOptions noCompress "tflite"）

